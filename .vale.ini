# SPDX-License-Identifier: Apache-2.0
#
# Vale config for TAP. Enforces RFC 2119 keyword discipline per
# docs/SPEC_STYLE.md §1.3 and DOCUMENTATION_PLAN.md §10.1.
#
# Run locally: `vale docs/ protocol/SPEC.md project-context.md`
# Install:     `brew install vale` (3.x) or grab a binary from errata-ai/vale.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Vocab is a markdown-aware terms file under .vale/styles/config/vocabularies/TAP/
# that exempts project-specific words from spelling warnings.
Vocab = TAP

# Default for all markdown files: enable RFC 2119 keyword discipline only.
# SpecVoice fires only inside the wire spec per docs/SPEC_STYLE.md §10.
[*.md]
BasedOnStyles = TAP
TAP.SpecVoice = NO

# Wire spec — the strictest dialect.
[protocol/SPEC.md]
BasedOnStyles = TAP
TAP.SpecVoice = suggestion

# Templates use placeholder text that intentionally violates rules.
[docs/phases/_template/*.md]
BasedOnStyles =

[docs/components/_template/*.md]
BasedOnStyles =

[docs/runbooks/_template.md]
BasedOnStyles =

[docs/rfcs/0000-template.md]
BasedOnStyles =

# Conformance fixtures are JSON; vale doesn't lint them anyway, but be explicit.
[protocol/conformance/**]
BasedOnStyles =
