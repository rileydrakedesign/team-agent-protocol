name: Bug report
description: Something is not working as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please:
        - Search existing issues to avoid duplicates.
        - For security vulnerabilities, follow `docs/SECURITY.md` instead.
  - type: input
    id: component
    attributes:
      label: Affected component
      description: protocol, daemon, relay-edge, relay-core, relay-worker, adapter (which?), web, codegen, docs
      placeholder: e.g. daemon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.2 or commit abc1234
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include configuration, commands, and inputs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, editor, agent runtime, anything else relevant.
      placeholder: |
        OS:
        Editor:
        Agent:
        Bazel version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace output
      description: Daemon logs, OpenTelemetry trace IDs, relay error responses.
      render: shell
