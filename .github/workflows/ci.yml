# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: Bazel build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build --config=ci //...

      - name: Test
        run: bazel test --config=ci //...

  codegen-drift:
    name: Codegen drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-codegen
          repository-cache: true

      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.1

      - name: Set up Rust (for cargo-typify install)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-typify binary
        uses: actions/cache@v4
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-${{ runner.os }}-v0.6

      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --locked

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.18"
          cache: pnpm

      - name: Install json-schema-to-typescript
        run: pnpm install -g json-schema-to-typescript

      - name: Regenerate bindings
        run: bazel run --config=ci //tools/codegen:generate

      - name: Verify no drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated bindings drifted. Run 'bazel run //tools/codegen:generate' and commit the result."
            exit 1
          fi

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  doc-lints:
    name: Doc lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.18"

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.22.1

      - name: Install vale
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v3.14.1/vale_3.14.1_Linux_64-bit.tar.gz" | tar xz vale
          sudo mv vale /usr/local/bin/
          vale --version

      - name: Run vale
        run: vale docs/ protocol/SPEC.md project-context.md README.md

      - name: Run doclint
        run: python tools/doclint/doclint.py

      - name: Generate doc dashboard
        run: python tools/doclint/doclint.py --dashboard > doc-dashboard.md

      - name: Upload doc dashboard
        uses: actions/upload-artifact@v4
        with:
          name: doc-dashboard
          path: doc-dashboard.md
          retention-days: 30

  conformance:
    name: Protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [bazel]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-conformance
          repository-cache: true

      - name: Run conformance suite (Rust + Go)
        run: |
          bazel test --config=ci \
            //crates/tap-protocol:tap-protocol_test \
            //pkg/protocol:protocol_test

  typescript:
    name: TypeScript build & conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.18"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r build

      # Note: this exercises the conformance suite via node --test against the
      # compiled dist/. A Bazel `js_test` target is deferred until npm/Bazel
      # integration lands; see packages/tap-protocol/BUILD.bazel.
      - name: Run TypeScript conformance suite
        run: pnpm --filter @tap/protocol test
