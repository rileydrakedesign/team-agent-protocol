# SPDX-License-Identifier: Apache-2.0
#
# Pre-commit hooks for TAP. Install with:
#   pip install pre-commit
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: '.*\.tsbuildinfo$'
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.0.3
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: clippy
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-mod-tidy

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, ts, tsx, css, json, yaml, markdown]
        exclude: |
          (?x)^(
            .*/generated/.*|
            .*\.tsbuildinfo|
            CHANGELOG\.md
          )$

  - repo: local
    hooks:
      - id: cue-fmt
        name: cue fmt
        description: Format CUE files
        entry: cue fmt
        language: system
        types: [file]
        files: '\.cue$'

      - id: addlicense
        name: addlicense
        description: Ensure SPDX license headers are present
        entry: addlicense -l apache -c "The TAP Authors" -s=only
        language: golang
        additional_dependencies:
          - "github.com/google/addlicense@v1.1.1"
        types_or: [rust, go, python, shell, javascript, ts, tsx]
        exclude: |
          (?x)^(
            .*/generated/.*|
            .*/vendor/.*|
            .*/node_modules/.*
          )$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

ci:
  autofix_commit_msg: |
    style: auto-fix from pre-commit hooks

    [pre-commit.ci] auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: "build(deps): update pre-commit hook versions"
  autoupdate_schedule: monthly
