# SPDX-License-Identifier: Apache-2.0

[package]
name = "tap-protocol"
version = "0.1.0-draft"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "TAP — Team Agent Protocol — Rust bindings, schemas, and envelope helpers"
repository = "https://github.com/tap-dev/tap"
homepage = "https://tap.dev"
documentation = "https://docs.rs/tap-protocol"
keywords = ["tap", "agent", "protocol", "mcp", "a2a"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
